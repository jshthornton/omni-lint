[workspace]
resolver = "2"
members = ["crates/omni-core", "crates/omni-graphql", "crates/omni-wasm", "crates/omni-lint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
globset = "0.4"
omni-core = { path = "crates/omni-core" }
omni-graphql = { path = "crates/omni-graphql" }
omni-wasm = { path = "crates/omni-wasm" }
